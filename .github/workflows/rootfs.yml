name: awnix WSL rootfs

# Builds the awnix root filesystem for `wsl --import` ONCE, on Linux, where the container
# engine applies OCI layers and whiteouts correctly. The Windows script then downloads one
# verified file and needs no Python. A container started from the built tarball must boot
# and identify itself, or the release is not published.

on:
  workflow_dispatch:
    inputs:
      image:
        description: awnix image
        default: ghcr.io/aitherium/awnix:latest
  push:
    branches: [main]
    paths: [.github/workflows/rootfs.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ${{ inputs.image || 'ghcr.io/aitherium/awnix:latest' }}
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Pull and flatten (linux/amd64)
        run: |
          docker pull --platform linux/amd64 "$IMAGE"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
          cid=$(docker create --platform linux/amd64 "$IMAGE" /bin/true)
          docker export "$cid" -o awnix-rootfs.tar
          docker rm "$cid"
          ls -la awnix-rootfs.tar

      - name: Prove the tarball boots (import it and run it)
        run: |
          docker import awnix-rootfs.tar awnix-wsl-check:latest
          docker run --rm awnix-wsl-check:latest cat /etc/os-release | tee os-release.txt
          grep -q '^ID=' os-release.txt
          docker run --rm awnix-wsl-check:latest sh -c 'test -x /usr/bin/bash && test -d /usr/lib/systemd && echo "bash + systemd present"'

      - name: Compress, split under the 2 GiB asset cap, checksum
        run: |
          gzip -6 -c awnix-rootfs.tar > awnix-rootfs.tar.gz
          rm awnix-rootfs.tar
          split -b 1900M -d -a 1 awnix-rootfs.tar.gz awnix-rootfs.tar.gz.part
          rm awnix-rootfs.tar.gz
          sha256sum awnix-rootfs.tar.gz.part* > SHA256SUMS
          cat SHA256SUMS
          ls -la awnix-rootfs.tar.gz.part*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="rootfs-$(date -u +%Y%m%d-%H%M)"
          printf 'awnix WSL rootfs from %s\n\nBuilt by docker export; booted and checked (/etc/os-release, bash, systemd) before publishing.\n' "$DIGEST" > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --latest \
            awnix-rootfs.tar.gz.part* SHA256SUMS os-release.txt
